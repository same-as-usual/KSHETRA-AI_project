[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kshetra-ai"
version = "0.2.0"
description = "Explainable district deprivation and intervention-intelligence prototype for India"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "plotly>=5.18",
  "streamlit>=1.30",
  "Pillow>=10.0",
  "httpx>=0.24",
]

[project.optional-dependencies]
boost = ["xgboost>=2.0"]
llm = ["google-generativeai>=0.8,<0.9", "openai>=1,<3"]
dev = ["pytest>=7.4"]
geo = ["geopandas>=0.14"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
